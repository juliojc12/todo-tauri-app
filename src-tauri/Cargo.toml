[package]
name = "todo-app"
version = "0.1.0"
description = "Todo App com tarefas e subtarefas"
authors = ["jcsilva"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and not conflict with the bin name on Windows.
name = "todo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
